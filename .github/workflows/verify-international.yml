name: Verify free international football endpoints
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-free-2026-data:
    if: github.head_ref == 'feat/international-football-free-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-international-free.cjs
