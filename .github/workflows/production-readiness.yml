name: Production readiness
on:
  push:
    branches: [main, fix/production-readiness-2026-10-31]
  pull_request:
    branches: [main]
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  verify-public-football-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documented free 2026 Ethiopian football endpoints
        run: node scripts/probe-free-providers.cjs
