<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioLiveScores Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans transition-colors duration-200">
    <header class="bg-white dark:bg-gray-800 p-4 border-b dark:border-gray-700 flex justify-between items-center shadow">
        <h1 class="font-bold text-xl text-green-500">EthioLiveScores</h1>
        <button onclick="toggleTheme()" class="bg-gray-200 dark:bg-gray-700 p-2 rounded text-xs font-bold">Toggle Theme</button>
    </header>

    <main class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
        <section class="md:col-span-2 space-y-4">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border dark:border-gray-700 text-center">
                <span class="text-xs bg-red-500 text-white px-2 py-0.5 rounded font-bold animate-pulse">LIVE</span>
                <div class="flex justify-between items-center mt-4">
                    <span class="font-bold">St. George</span>
                    <span class="text-3xl font-extrabold" id="score-display">0 - 0</span>
                    <span class="font-bold">Ethiopian Coffee</span>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border dark:border-gray-700 flex flex-col h-64">
                <div id="chat-stream" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
                <div class="mt-2 flex space-x-2">
                    <input type="text" id="chatInput" class="flex-1 bg-gray-100 dark:bg-gray-700 p-2 rounded text-xs focus:outline-none" placeholder="Chat live...">
                    <button onclick="sendChat()" class="bg-green-600 text-white px-4 rounded text-xs font-bold">Send</button>
                </div>
            </div>
        </section>

        <aside class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border dark:border-gray-700">
            <h3 class="font-bold text-sm mb-2 border-b pb-1">Standings</h3>
            <div id="standings" class="text-xs space-y-1">Loading...</div>
        </aside>
    </main>

    <script>
        const API = 'http://localhost:5000/api';
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        async function loadChat() {
            try {
                const res = await fetch(`${API}/chat/1`);
                const logs = await res.json();
                const box = document.getElementById('chat-stream');
                box.innerHTML = logs.map(m => `<div><b class="text-yellow-600">@${m.username}:</b> ${m.message_text}</div>`).join('');
                box.scrollTop = box.scrollHeight;
            } catch(e){}
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const token = localStorage.getItem('token');
            if(!token) return alert('Please login first!');
            await fetch(`${API}/chat/1`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ message_text: input.value })
            });
            input.value = ''; loadChat();
        }
        setInterval(loadChat, 4000); loadChat();
    </script>
</body>
</html>
